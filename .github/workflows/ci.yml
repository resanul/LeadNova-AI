name: GlobalLead AI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Backend Test & Lint (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        working-directory: apps/api
        run: |
          pytest -v

  frontend-ci:
    name: Frontend Build & Typecheck (Next.js 14)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/admin-web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/admin-web
        run: npm ci

      - name: Build Next.js Production Bundle
        working-directory: apps/admin-web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build

  docker-ci:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          push: false
          tags: globallead-api:latest

      - name: Build Admin Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: apps/admin-web
          push: false
          tags: globallead-admin-web:latest
